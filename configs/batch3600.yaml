# Spend flushed to the DB hourly, as in BerriAI/litellm#43732 (deployments raise this to cut DB writes).
model_list:
  - model_name: gpt-test
    litellm_params:
      model: openai/gpt-test
      api_base: http://mock:8080/v1
      api_key: not-used
      input_cost_per_token: 0
      output_cost_per_token: 0.00001

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  proxy_batch_write_at: 3600
