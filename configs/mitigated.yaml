# Workaround reported in BerriAI/litellm#43732: longer Redis TTL plus a shorter flush interval.
model_list:
  - model_name: gpt-test
    litellm_params:
      model: openai/gpt-test
      api_base: http://mock:8080/v1
      api_key: not-used
      input_cost_per_token: 0
      output_cost_per_token: 0.00001

litellm_settings:
  default_redis_ttl: 3600

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  proxy_batch_write_at: 60
